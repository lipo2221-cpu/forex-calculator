<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Position Size Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f2f5;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.calculator {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 95%;
  max-width: 360px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  text-align: center;
}

h2 {
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}

.result {
  margin-top: 20px;
  font-size: 18px;
  font-weight: bold;
}

.hint {
  font-size: 12px;
  color: #555;
  margin-top: 10px;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  body { background: #0f172a; }
  .calculator { background: #111827; color: white; }
  input, select { background: #1f2937; color: white; border: 1px solid #374151; }
  button { background: #2563eb; }
  .hint { color: #9ca3af; }
}
</style>
</head>

<body>

<div class="calculator">
  <h2>Forex Calculator</h2>

  <input type="number" id="balance" placeholder="Account Balance ($)">
  <input type="number" id="risk" placeholder="Risk %">
  <input type="number" id="stopLoss" placeholder="Stop Loss (pips)">

  <select id="pair" onchange="togglePriceInput()">
    <option value="EURUSD">EUR/USD</option>
    <option value="GBPUSD">GBP/USD</option>
    <option value="USDJPY">USD/JPY</option>
  </select>

  <!-- Only needed for JPY -->
  <input type="number" id="price" placeholder="USDJPY Price (e.g. 150.00)" style="display:none;">

  <button onclick="calculate()">Calculate Lot Size</button>

  <div class="result" id="result"></div>
  <div class="hint" id="hint"></div>
</div>

<script>

function togglePriceInput() {
  const pair = document.getElementById('pair').value;
  const priceInput = document.getElementById('price');
  const hint = document.getElementById('hint');

  if (pair === "USDJPY") {
    priceInput.style.display = "block";
    hint.innerText = "USD/JPY uses live price for accurate pip value.";
  } else {
    priceInput.style.display = "none";
    hint.innerText = "EUR/USD & GBP/USD use fixed $10 per pip.";
  }
}

function calculate() {
  const balance = parseFloat(document.getElementById('balance').value);
  const risk = parseFloat(document.getElementById('risk').value);
  const stopLoss = parseFloat(document.getElementById('stopLoss').value);
  const pair = document.getElementById('pair').value;
  const price = parseFloat(document.getElementById('price').value);

  if (!balance || !risk || !stopLoss) {
    document.getElementById('result').innerText = "Enter all values!";
    return;
  }

  let pipValue;

  if (pair === "USDJPY") {
    if (!price) {
      document.getElementById('result').innerText = "Enter USDJPY price!";
      return;
    }
    pipValue = (0.01 / price) * 100000;
  } else {
    pipValue = 10; // EURUSD & GBPUSD
  }

  const riskAmount = balance * (risk / 100);
  const lotSize = riskAmount / (stopLoss * pipValue);

  document.getElementById('result').innerText =
    `Lot Size: ${lotSize.toFixed(2)} lots`;
}

// Initialize hint on load
togglePriceInput();

</script>

</body>
</html>
