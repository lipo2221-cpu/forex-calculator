<style>
body {
  font-family: Arial;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.calculator {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 95%;
  max-width: 360px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  text-align: center;
  color: #111; /* ✅ ensure text visible */
}

h2 {
  color: #111;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
  background: white;
  color: #111;
}

button {
  width: 100%;
  padding: 15px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
}

.result {
  margin-top: 20px;
  font-weight: bold;
  font-size: 18px;
  color: #003366;
}

.hint {
  font-size: 12px;
  margin-top: 10px;
  color: #555;
}

/* ✅ DARK MODE FIXED */
@media (prefers-color-scheme: dark) {

  body {
    background: #0f172a;
  }

  .calculator {
    background: #111827;
    color: #e5e7eb; /* ✅ FIX: text visible */
  }

  h2 {
    color: #e5e7eb;
  }

  input, select {
    background: #1f2937;
    color: #e5e7eb;
    border: 1px solid #374151;
  }

  input::placeholder {
    color: #9ca3af;
  }

  button {
    background: #2563eb;
  }

  button:hover {
    background: #1d4ed8;
  }

  .result {
    color: #ffffff; /* ✅ FIX: result visible */
  }

  .hint {
    color: #9ca3af;
  }
}
</style>
