<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Calculator</title>

<style>
body {
  font-family: Arial;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.calculator {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 95%;
  max-width: 360px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  text-align: center;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 15px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
}

.result {
  margin-top: 20px;
  font-weight: bold;
  font-size: 18px;
}

.hint {
  font-size: 12px;
  margin-top: 10px;
  color: #555;
}
</style>
</head>

<body>

<div class="calculator">
  <h2>Forex Calculator</h2>

  <input type="number" id="balance" placeholder="Balance ($)">
  <input type="number" id="risk" placeholder="Risk %">
  <input type="number" id="stopLoss" placeholder="Stop Loss (pips)">

  <select id="pair" onchange="updateHint()">
    <option value="EURUSD">EUR/USD</option>
    <option value="GBPUSD">GBP/USD</option>
    <option value="USDJPY">USD/JPY</option>
  </select>

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="result"></div>
  <div class="hint" id="hint"></div>
</div>

<script>

let usdJpyPrice = null;

// Fetch live USDJPY
async function fetchPrice() {
  try {
    const res = await fetch('https://cdn.moneyconvert.net/api/latest.json');
    const data = await res.json();
    usdJpyPrice = data.rates.JPY;
    updateHint();
  } catch (err) {
    console.error("Price fetch failed", err);
  }
}

function updateHint() {
  const pair = document.getElementById('pair').value;
  const hint = document.getElementById('hint');

  if (pair === "USDJPY") {
    hint.innerText = usdJpyPrice
      ? `Live USDJPY: ${usdJpyPrice.toFixed(2)}`
      : "Loading USDJPY...";
  } else {
    hint.innerText = "$10 per pip (EURUSD / GBPUSD)";
  }
}

function calculate() {
  const balance = parseFloat(document.getElementById('balance').value);
  const risk = parseFloat(document.getElementById('risk').value);
  const stopLoss = parseFloat(document.getElementById('stopLoss').value);
  const pair = document.getElementById('pair').value;

  if (!balance || !risk || !stopLoss) {
    document.getElementById('result').innerText = "Fill all fields!";
    return;
  }

  let pipValue;

  if (pair === "USDJPY") {
    if (!usdJpyPrice) {
      document.getElementById('result').innerText = "Price loading...";
      return;
    }
    pipValue = (0.01 / usdJpyPrice) * 100000;
  } else {
    pipValue = 10;
  }

  const riskAmount = balance * (risk / 100);
  const lotSize = riskAmount / (stopLoss * pipValue);

  // ✅ ONLY CHANGE HERE → 2 decimals
  document.getElementById('result').innerText =
    `Lot Size: ${lotSize.toFixed(2)} lots`;
}

// Init
fetchPrice();

</script>

</body>
</html>
