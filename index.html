<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Calculator</title>

<style>
body {
  font-family: Arial;
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.calculator {
  background: white;
  padding: 25px;
  border-radius: 12px;
  width: 95%;
  max-width: 360px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  text-align: center;
}

input, select {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  width: 100%;
  padding: 15px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
}

.result {
  margin-top: 20px;
  font-weight: bold;
  font-size: 18px;
}

.hint {
  font-size: 12px;
  margin-top: 10px;
  color: #555;
}
</style>
</head>

<body>

<div class="calculator">
  <h2>Forex Calculator</h2>

  <input type="number" id="balance" placeholder="Balance ($)">
  <input type="number" id="risk" placeholder="Risk %">
  <input type="number" id="stopLoss" placeholder="Stop Loss (pips)">

  <select id="pair">
    <option value="EURUSD">EUR/USD</option>
    <option value="GBPUSD">GBP/USD</option>
    <option value="USDJPY">USD/JPY</option>
    <option value="AUDUSD">AUD/USD</option>
    <option value="USDCAD">USD/CAD</option>
    <option value="USDCHF">USD/CHF</option>
    <option value="NZDUSD">NZD/USD</option>
    <option value="EURJPY">EUR/JPY</option>
    <option value="GBPJPY">GBP/JPY</option>
    <option value="EURGBP">EUR/GBP</option>
    <option value="AUDJPY">AUD/JPY</option>
    <option value="CADJPY">CAD/JPY</option>
    <option value="CHFJPY">CHF/JPY</option>
    <option value="NZDJPY">NZD/JPY</option>
    <option value="EURAUD">EUR/AUD</option>
    <option value="GBPAUD">GBP/AUD</option>
    <option value="AUDCAD">AUD/CAD</option>
    <option value="AUDCHF">AUD/CHF</option>
    <option value="AUDNZD">AUD/NZD</option>
    <option value="CADCHF">CAD/CHF</option>
    <option value="NZDCAD">NZD/CAD</option>
    <option value="NZDCHF">NZD/CHF</option>
  </select>

  <input type="text" id="customPair" placeholder="Or type pair (e.g. EURUSD)">

  <button onclick="calculate()">Calculate</button>

  <div class="result" id="result"></div>
  <div class="hint" id="hint"></div>
</div>

<script>

let livePrice = null;
let ratesData = null;

// =====================
// LOCAL STORAGE
// =====================
function saveInputs() {
  localStorage.setItem('balance', balance.value);
  localStorage.setItem('risk', risk.value);
  localStorage.setItem('stopLoss', stopLoss.value);
  localStorage.setItem('pair', pair.value);
  localStorage.setItem('customPair', customPair.value);
  localStorage.setItem('result', result.innerText);
}

function loadInputs() {
  if (localStorage.getItem('balance')) balance.value = localStorage.getItem('balance');
  if (localStorage.getItem('risk')) risk.value = localStorage.getItem('risk');
  if (localStorage.getItem('stopLoss')) stopLoss.value = localStorage.getItem('stopLoss');
  if (localStorage.getItem('pair')) pair.value = localStorage.getItem('pair');
  if (localStorage.getItem('customPair')) customPair.value = localStorage.getItem('customPair');
  if (localStorage.getItem('result')) result.innerText = localStorage.getItem('result');
}

// =====================
// GET ACTIVE PAIR
// =====================
function getPair() {
  const custom = customPair.value.trim().toUpperCase();
  return custom || pair.value;
}

// =====================
// FETCH LIVE PRICE
// =====================
async function fetchPrice() {
  const activePair = getPair();

  if (activePair.length !== 6) return;

  const base = activePair.substring(0, 3);
  const quote = activePair.substring(3, 6);

  try {
    const res = await fetch('https://cdn.moneyconvert.net/api/latest.json');
    const data = await res.json();
    ratesData = data.rates;

    if (base === "USD") {
      livePrice = ratesData[quote];
    } else if (quote === "USD") {
      livePrice = 1 / ratesData[base];
    } else {
      const baseRate = ratesData[base];
      const quoteRate = ratesData[quote];
      livePrice = quoteRate / baseRate;
    }

    updateHint();
  } catch (err) {
    console.error("Price fetch failed", err);
  }
}

// =====================
// UI
// =====================
function updateHint() {
  const activePair = getPair();

  if (!activePair || activePair.length !== 6) {
    hint.innerText = "Enter valid pair (e.g. EURUSD)";
    return;
  }

  if (livePrice) {
    hint.innerText = `Live ${activePair}: ${livePrice.toFixed(5)}`;
  } else {
    hint.innerText = "Loading price...";
  }
}

// =====================
// CALCULATION
// =====================
function calculate() {
  const balanceVal = parseFloat(balance.value);
  const riskVal = parseFloat(risk.value);
  const stopLossVal = parseFloat(stopLoss.value);
  const activePair = getPair();

  if (!balanceVal || !riskVal || !stopLossVal || activePair.length !== 6) {
    result.innerText = "Fill all fields correctly!";
    return;
  }

  if (!livePrice || !ratesData) {
    result.innerText = "Price loading...";
    return;
  }

  let pipValue;

  if (activePair.includes("JPY")) {
    pipValue = (0.01 / livePrice) * 100000;
  } else {
    pipValue = (0.0001 / livePrice) * 100000;
  }

  const quote = activePair.substring(3, 6);

  // Convert pip value to USD if needed
  if (quote !== "USD") {
    const rateToUSD = ratesData[quote];
    pipValue = pipValue / rateToUSD;
  }

  const riskAmount = balanceVal * (riskVal / 100);
  const lotSize = riskAmount / (stopLossVal * pipValue);

  result.innerText = `Lot Size: ${lotSize.toFixed(2)} lots`;

  saveInputs();
}

// =====================
// EVENTS
// =====================
balance.addEventListener('input', saveInputs);
risk.addEventListener('input', saveInputs);
stopLoss.addEventListener('input', saveInputs);

pair.addEventListener('change', () => {
  saveInputs();
  fetchPrice();
});

customPair.addEventListener('input', () => {
  saveInputs();
  fetchPrice();
});

// =====================
// AUTO REFRESH PRICE
// =====================
setInterval(fetchPrice, 10000); // every 10s

// =====================
// INIT
// =====================
loadInputs();
fetchPrice();
updateHint();

</script>

</body>
</html>
